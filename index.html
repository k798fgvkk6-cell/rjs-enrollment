  <body class="bg-[#050507] text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Curriculum Lesson Click Interceptor & Portal Restricted Modal Logic
      document.addEventListener('click', function(e) {
        var card = e.target.closest('.lesson-card, .module-item');
        var modal = document.getElementById('portal-restricted-modal');
        var titleEl = document.getElementById('portal-restricted-title');

        if (card) {
          e.preventDefault();
          var title = card.getAttribute('data-title') || (card.querySelector('h4') ? card.querySelector('h4').innerText.trim() : 'Phase 1 Start & Rules');
          if (titleEl) {
            titleEl.textContent = title.indexOf('- Video Locked') !== -1 ? title : title + ' - Video Locked';
          }
          if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          }
        } else if (modal && e.target === modal) {
          // Dark background overlay click closes modal
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        } else if (modal && e.target.closest('[data-close-restricted-modal]')) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      });
    </script>
  </body>
</html>
